<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 学习 - open-study</title>
<style>
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:640px;margin:0 auto;padding:24px 16px;color:#222;line-height:1.6}
h1{font-size:22px;text-align:center;margin:0 0 4px}
.sub{text-align:center;color:#555;font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;margin:10px 0 4px}
select,input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
#chat{border:1px solid #ddd;border-radius:12px;height:380px;overflow-y:auto;padding:12px;margin:16px 0;background:#fafafa}
.msg{margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
.msg.user{text-align:right}
.msg.user span{display:inline-block;background:#12b7f5;color:#fff;padding:8px 12px;border-radius:12px;max-width:90%;text-align:left}
.msg.ai span{display:inline-block;background:#fff;border:1px solid #ddd;padding:8px 12px;border-radius:12px;max-width:90%}
.msg.err span{display:inline-block;background:#fff0f0;border:1px solid #f0c0c0;color:#a00;padding:8px 12px;border-radius:12px;max-width:90%}
.row{display:flex;gap:8px}
#input{flex:1;resize:none;max-height:180px;overflow-y:auto}
button{padding:10px 16px;border:0;border-radius:8px;font-size:15px;cursor:pointer}
#send{background:#12b7f5;color:#fff}
#clear{background:#eee;color:#333}
.note{font-size:13px;color:#666;text-align:left}
.back{text-align:center;margin-top:16px}
#lock{position:fixed;inset:0;background:#fff;z-index:99;display:none;align-items:center;justify-content:center}
#lock .box{max-width:320px;width:90%;text-align:center}
#lock input{margin:6px 0}
#lockBtn{width:100%;background:#12b7f5;color:#fff;margin-top:6px}
#lockMsg{color:#a00;font-size:14px;min-height:20px;margin:8px 0 0}
#skip{background:none;border:0;color:#888;font-size:13px;text-decoration:underline;padding:6px;margin-top:10px}
</style>
</head>
<body>
<div id="lock">
 <div class="box">
  <h1>AI 学习</h1>
  <p class="sub" id="lockTip">请输入访问密码</p>
  <input id="pwd" type="password" placeholder="访问密码" autocomplete="off">
  <input id="pwd2" type="password" placeholder="再输一次确认" style="display:none" autocomplete="off">
  <button id="lockBtn">进入</button>
  <p id="lockMsg"></p>
  <button id="skip" style="display:none">服务器连不上？仍进入页面（仅 Pollinations 可用）</button>
 </div>
</div>
<h1>AI 学习</h1>
<div id="chat"></div>
<div class="row">
<textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行" autocomplete="off"></textarea>
<button id="send">发送</button>
<button id="clear">清空对话</button>
</div>
 <p class="sub">不保留历史记录：对话只在当前页面内存里，刷新或点“清空对话”就没了。</p>
<label for="provider">模型服务</label>
<select id="provider">
<option value="agnes-cn" selected>Agnes AI 中国站（免 key，经代理）</option>
<option value="pollinations">Pollinations 免费（免 key，可直接用）</option>
</select>
<label for="base" style="display:none">API 地址（Base URL）</label>
<input id="base" value="" style="display:none">
<label for="model" style="display:none">模型</label>
<input id="model" value="openai" style="display:none">
<label for="key">API Key（只发给你选的模型服务，不写进仓库）</label>
<input id="key" type="password" placeholder="Pollinations 和 Agnes 免 key，其他服务需填" autocomplete="off">
<label><input type="checkbox" id="remember" style="width:auto"> 记住密钥到本浏览器（不勾就只保存在本页内存，刷新就忘）</label>
<p class="back"><a href="index.html">返回导航</a> · <a href="https://github.com/liviamye/open-study">返回 open-study</a></p>
<script>
var AGNES="https://data.mymap.cc.cd/agnes.php";
var lockEl=document.getElementById("lock"),lockTip=document.getElementById("lockTip"),pwdEl=document.getElementById("pwd"),pwd2El=document.getElementById("pwd2"),lockBtn=document.getElementById("lockBtn"),lockMsg=document.getElementById("lockMsg"),skipBtn=document.getElementById("skip");
var setupMode=false;
function showLock(tip,msg){if(tip)lockTip.textContent=tip;lockMsg.textContent=msg||"";lockEl.style.display="flex";pwdEl.focus();}
function hideLock(){lockEl.style.display="none";}
function getToken(){try{return localStorage.getItem("aichat_token")||"";}catch(e){return"";}}
function setToken(t){try{localStorage.setItem("aichat_token",t);}catch(e){}}
function clearToken(){try{localStorage.removeItem("aichat_token");}catch(e){}}
function postAuth(obj){return fetch(AGNES,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(obj)}).then(function(r){return r.json().catch(function(){return{};}).then(function(j){return{code:r.status,j:j};});});}
function tryEnter(){
 var pw=pwdEl.value;
 lockMsg.textContent="";
 if(setupMode){
  if(pw.length<6){lockMsg.textContent="密码至少 6 位";return;}
  if(pw!==pwd2El.value){lockMsg.textContent="两次输入不一致";return;}
  lockBtn.disabled=true;lockMsg.textContent="设置中…";
  postAuth({action:"setup",password:pw}).then(function(r){
   lockBtn.disabled=false;
   if(r.code===200&&r.j.token){setToken(r.j.token);hideLock();}
   else if(r.code===409){lockMsg.textContent="密码已被设置过，请直接登录";setupMode=false;pwd2El.style.display="none";lockBtn.textContent="进入";lockTip.textContent="请输入访问密码";}
   else{lockMsg.textContent="设置失败："+(r.j.error||("HTTP "+r.code));}
  }).catch(function(e){lockBtn.disabled=false;lockMsg.textContent="连不上服务器："+e.message;});
 }else{
  if(!pw){lockMsg.textContent="请输入密码";return;}
  lockBtn.disabled=true;lockMsg.textContent="验证中…";
  postAuth({action:"login",password:pw}).then(function(r){
   lockBtn.disabled=false;
   if(r.code===200&&r.j.token){setToken(r.j.token);hideLock();}
   else if(r.code===401){lockMsg.textContent="密码错误";pwdEl.select();}
   else{lockMsg.textContent="服务器返回异常：HTTP "+r.code;}
  }).catch(function(e){lockBtn.disabled=false;lockMsg.textContent="连不上服务器："+e.message;skipBtn.style.display="";});
 }
}
lockBtn.addEventListener("click",tryEnter);
pwdEl.addEventListener("keydown",function(e){if(e.key==="Enter")tryEnter();});
pwd2El.addEventListener("keydown",function(e){if(e.key==="Enter")tryEnter();});
skipBtn.addEventListener("click",hideLock);
fetch(AGNES+"?auth=status").then(function(r){return r.json();}).then(function(j){
 if(!j.set){setupMode=true;pwd2El.style.display="";lockBtn.textContent="设置并进入";showLock("首次使用，请设置访问密码（至少 6 位）");}
 else if(getToken()){hideLock();}
 else{showLock("请输入访问密码");}
}).catch(function(e){showLock("连不上密码服务器","网络错误："+e.message);skipBtn.style.display="";});

var providers={
 "agnes-cn":{base:AGNES,model:"agnes-3.0-flash",needsKey:false,raw:true},
 pollinations:{base:"",model:"openai",needsKey:false}
};
var providerEl=document.getElementById("provider"),baseEl=document.getElementById("base"),modelEl=document.getElementById("model"),keyEl=document.getElementById("key"),rememberEl=document.getElementById("remember"),chatEl=document.getElementById("chat"),inputEl=document.getElementById("input");
keyEl.style.display=providers[providerEl.value].needsKey?"":"none";baseEl.value=providers[providerEl.value].base;modelEl.value=providers[providerEl.value].model;
var messages=[];
try{var savedKey=localStorage.getItem("chat_api_key");if(savedKey){keyEl.value=savedKey;rememberEl.checked=true;}}catch(e){}
providerEl.addEventListener("change",function(){var p=providers[providerEl.value];baseEl.value=p.base;modelEl.value=p.model;keyEl.style.display=p.needsKey?"":"none";});
keyEl.addEventListener("change",function(){try{if(rememberEl.checked){localStorage.setItem("chat_api_key",keyEl.value);}else{localStorage.removeItem("chat_api_key");}}catch(e){}});
rememberEl.addEventListener("change",function(){try{if(rememberEl.checked){localStorage.setItem("chat_api_key",keyEl.value);}else{localStorage.removeItem("chat_api_key");}}catch(e){}});
function addMsg(role,text,cls){var d=document.createElement("div");d.className="msg "+(cls||role);var s=document.createElement("span");s.textContent=text;d.appendChild(s);chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;}
function send(){var text=inputEl.value.trim();if(!text)return;var prov=providerEl.value,p=providers[prov];addMsg("user",text);messages.push({role:"user",content:text});inputEl.value="";inputEl.style.height="auto";addMsg("ai","思考中…");var thinking=chatEl.lastChild;
 if(prov==="pollinations"){fetch("https://text.pollinations.ai/"+encodeURIComponent(text)).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();}).then(function(t){thinking.querySelector("span").textContent=t;messages.push({role:"assistant",content:t});}).catch(function(e){thinking.className="msg err";thinking.querySelector("span").textContent="出错了："+e.message;});return;}
 var key=keyEl.value.trim();if(!key&&p.needsKey){thinking.className="msg err";thinking.querySelector("span").textContent="请先填 API Key（Pollinations 和 Agnes 免 key 不用填）。密钥只发给你选的模型服务，不写进仓库。";return;}
 var base=baseEl.value.replace(/\/+$/,"");
 var hdrs=p.raw?{"Content-Type":"text/plain"}:{"Content-Type":"application/json"};if(key)hdrs["Authorization"]="Bearer "+key;
 var bodyObj={model:modelEl.value.trim(),messages:messages};if(prov==="agnes-cn")bodyObj.token=getToken();
 fetch((p.raw?base:base+"/chat/completions"),{method:"POST",headers:hdrs,body:JSON.stringify(bodyObj)}).then(function(r){if(r.status===401){clearToken();showLock("登录已过期，请重新输入密码");throw new Error("登录已失效，请重新输入访问密码");}if(!r.ok)return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,300));});return r.json();}).then(function(j){var t=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"（无返回内容）";thinking.querySelector("span").textContent=t;messages.push({role:"assistant",content:t});}).catch(function(e){thinking.className="msg err";var msg="出错了："+e.message;if(String(e.message).indexOf("Failed to fetch")>=0||String(e.message).indexOf("NetworkError")>=0){msg="出错了：连不上 Agnes 代理（"+base.replace(/https?:\/\//,"")+"）。可能是网络线路问题，稍后再试。";}thinking.querySelector("span").textContent=msg;});
}
document.getElementById("send").addEventListener("click",send);
inputEl.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
inputEl.addEventListener("input",function(){inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px";});
document.getElementById("clear").addEventListener("click",function(){messages=[];chatEl.innerHTML="";});
</script>
</body>
</html>
