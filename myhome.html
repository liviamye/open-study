<h1>myhome聊天室</h1>
<p>纯文字对话，不用安装、不用注册。进页面取个昵称就能打字，我这边开同一页就能看到并回复。</p>
<div class="chat">
<div id="tlkio" data-channel="open-study" style="width:100%;height:500px;"></div>
<script async src="https://tlk.io/embed.js" type="text/javascript"></script>
</div>
<p class="center"><a class="btn" href="https://tlk.io/open-study" target="_blank" rel="noopener">在新页面打开留言板</a></p>
<p class="note">提示：上面是 tlk.io 的公开聊天室（房间名 myhome），知道地址的人都能进来看到，不要发隐私、密码、订单号等。消息是实时对话、不是私聊；没装 QQ 也能用。</p>
